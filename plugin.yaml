name: jev-adaptive-effort
version: "0.1.0"
description: "Use TypeSafe Jev through OpenRouter to choose a cache-safe reasoning effort for each user turn."
author: "kirkins"
kind: standalone
manifest_version: 2
api_version: 1
license: MIT
homepage: "https://github.com/kirkins/hermes-jev-adaptive-effort"
tags:
  - jev
  - reasoning
  - openrouter
  - adaptive
provides_middleware:
  - reasoning_effort
requires_env:
  - name: OPENROUTER_API_KEY
    description: "API key used to call TypeSafe Jev through OpenRouter's Decisions API."
    url: "https://openrouter.ai/settings/keys"
    secret: true
config_schema:
  mode:
    type: str
    choices: [disabled, shadow, enforce]
    default: shadow
    description: "Shadow records decisions without applying them; enforce applies cache-safe choices."
  timeout_seconds:
    type: float
    default: 2.5
    description: "Maximum seconds to wait for a Jev decision."
  min_probability:
    type: float
    default: 0.65
    description: "Choices below this probability are hedged upward by one supported effort level."
  max_user_chars:
    type: int
    default: 6000
    description: "Maximum redacted characters from the current user message sent to OpenRouter."
  cache_entries:
    type: int
    default: 256
    description: "Number of per-turn decisions retained to prevent duplicate billed calls."
